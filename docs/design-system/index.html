<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nevis — redesign preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ───────────── tokens ───────────── */
:root{
  --accent:#0f8f83;
  --accent-ink:#ffffff;
  --accent-soft:color-mix(in oklab,var(--accent) 14%,var(--bg));
  --accent-line:color-mix(in oklab,var(--accent) 34%,var(--bg));
  --bg:color-mix(in oklab,var(--accent) 1.5%,#fff); --side:color-mix(in oklab,var(--accent) 5.5%,#f7f8f9); --raised:#ffffff; --sunk:color-mix(in oklab,var(--accent) 5.5%,#f1f3f4);
  --line:color-mix(in oklab,var(--accent) 9%,#e4e7ea); --line-2:color-mix(in oklab,var(--accent) 14%,#d6dae0);
  --text:#14171c; --text-2:#4b5360; --text-3:#7b8492;
  --hover:color-mix(in oklab,var(--accent) 8%,transparent); --press:color-mix(in oklab,var(--accent) 14%,transparent);
  --ok:#0f8f83; --warn:#c77d0a; --bad:#cf3b3b; --info:#3b6fd4;
  --shadow-pop:0 1px 2px rgba(16,24,40,.06),0 12px 32px -8px rgba(16,24,40,.18);
  --r-sm:7px; --r:10px; --r-lg:14px;
  --ui:'Instrument Sans','Vazirmatn',system-ui,sans-serif;
  --serif:'Newsreader','Vazirmatn',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --editor-font:var(--ui);
  --editor-size:17px; --editor-width:720px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --side-w:264px;
}
:root[data-theme=dark]{
  --accent-soft:color-mix(in oklab,var(--accent) 16%,var(--bg));
  --bg:color-mix(in oklab,var(--accent) 3%,#1e2128); --side:color-mix(in oklab,var(--accent) 6%,#191c22); --raised:color-mix(in oklab,var(--accent) 3%,#252931); --sunk:color-mix(in oklab,var(--accent) 5%,#292e37);
  --line:color-mix(in oklab,var(--accent) 8%,#343a45); --line-2:color-mix(in oklab,var(--accent) 12%,#434a57);
  --text:#e8eaee; --text-2:#b8bfca; --text-3:#8c95a3;
  --hover:color-mix(in oklab,var(--accent) 12%,transparent); --press:color-mix(in oklab,var(--accent) 20%,transparent);
  --shadow-pop:0 1px 2px rgba(0,0,0,.4),0 16px 40px -8px rgba(0,0,0,.65);
  --warn:#e0a13a; --bad:#ec6a6a; --info:#7aa2ee;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:400 14px/1.5 var(--ui);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in oklab,var(--accent) 28%,transparent)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
:root[dir=rtl] .flip{transform:scaleX(-1)}
.muted{color:var(--text-3)} .sub{color:var(--text-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:root[data-motion=off] *{transition:none!important;animation:none!important}

/* ───────────── shell ───────────── */
.app{display:grid;grid-template-columns:var(--side-w) 1fr;height:100vh;transition:grid-template-columns .25s var(--ease)}
.app.side-hidden{grid-template-columns:0 1fr}
.app.side-hidden .side{transform:translateX(-100%);opacity:0;pointer-events:none}
:root[dir=rtl] .app.side-hidden .side{transform:translateX(100%)}
:root[data-side=icons]{--side-w:64px}
:root[data-side=compact]{--side-w:232px}
.side{background:var(--side);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;transition:transform .25s var(--ease),opacity .2s}
.side-top{padding:14px 12px 8px;display:flex;flex-direction:column;gap:10px}
.vault{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r);text-align:start;width:100%}
.vault:hover{background:var(--hover)}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 15px/1 var(--serif);flex:none;letter-spacing:-.02em}
.vault b{font-weight:600;font-size:14px;display:block;line-height:1.2}
.vault small{font-size:11.5px;color:var(--text-3)}
.vault .i{margin-inline-start:auto;color:var(--text-3);width:16px}
.search-btn{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--raised);color:var(--text-3);width:100%;transition:border-color .15s}
.search-btn:hover{border-color:var(--line-2)}
.kbd{margin-inline-start:auto;font:500 11px/1 var(--ui);padding:3px 6px;border:1px solid var(--line);border-radius:5px;color:var(--text-3);background:var(--bg)}
.side-scroll{flex:1;overflow:auto;padding:4px 12px 12px;scrollbar-width:none;-ms-overflow-style:none}
.side-scroll::-webkit-scrollbar{display:none}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a,.row-btn{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:var(--r-sm);color:var(--text-2);cursor:pointer;position:relative;font-weight:450;white-space:nowrap;text-decoration:none;user-select:none}
.nav a:hover,.row-btn:hover{background:var(--hover);color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:550}
.nav a.on::before{content:"";position:absolute;inset-inline-start:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
:root[dir=rtl] .nav a.on::before{border-radius:3px 0 0 3px}
.badge{margin-inline-start:auto;font-style:normal;font-size:11.5px;font-weight:600;min-width:22px;height:22px;padding:0 4px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);color:var(--text-2);background:none;font-variant-numeric:tabular-nums}
.nav a.on .badge{border-color:var(--accent);color:var(--accent)}
.grp{display:flex;align-items:center;gap:6px;margin:18px 0 4px;padding:0 10px;font-size:12px;font-weight:550;color:var(--text-3);cursor:pointer;user-select:none}
.grp .i{width:14px;height:14px;transition:transform .2s}
.grp.shut .i{transform:rotate(-90deg)}
:root[dir=rtl] .grp.shut .i{transform:rotate(90deg)}
.tree a{height:30px}
.tree .lvl1{padding-inline-start:26px}
.tree .lvl2{padding-inline-start:42px}
.tile{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none;background:color-mix(in oklab,var(--c) 14%,var(--bg));color:var(--c)}
.tile .i{width:13px;height:13px;stroke-width:1.9}
.tile.lg{width:44px;height:44px;border-radius:12px}.tile.lg .i{width:22px;height:22px}
.tile.md{width:32px;height:32px;border-radius:9px}.tile.md .i{width:17px;height:17px}
.twist{width:14px;height:14px;margin-inline-start:-4px;color:var(--text-3);transition:transform .2s}
.twist.open{transform:rotate(90deg)}
:root[dir=rtl] .twist{transform:scaleX(-1)} :root[dir=rtl] .twist.open{transform:scaleX(-1) rotate(90deg)}
.cnt{margin-inline-start:auto;font-size:11.5px;color:var(--text-3)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px}
.side-foot{padding:10px 12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:var(--r);font-weight:550;border:1px solid var(--line);background:var(--raised);transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--sunk);border-color:var(--line-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08);background:var(--accent)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.acc:hover{background:var(--accent);filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:28px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--text-2);transition:background .15s}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent)}
:root[data-side=icons] .side .hide-icons,:root[data-side=icons] .side .nav a span,:root[data-side=icons] .side .grp,:root[data-side=icons] .side .tree,:root[data-side=icons] .side .tagrow,:root[data-side=icons] .side .badge,:root[data-side=icons] .side .kbd,:root[data-side=icons] .side .search-btn span,:root[data-side=icons] .side .vault div,:root[data-side=icons] .side .vault .i,:root[data-side=icons] .side .foot-label{display:none}
:root[data-side=icons] .nav a{justify-content:center;padding:0}
:root[data-side=icons] .search-btn{justify-content:center;padding:0}
:root[data-side=icons] .vault{justify-content:center}
:root[data-side=icons] .nav a.on::before{inset-inline-start:-12px}
:root[data-side=compact] .nav a{height:28px}:root[data-side=compact] .tree a{height:26px}

.main{display:flex;flex-direction:column;min-width:0;height:100vh;background:var(--bg)}
.top{height:52px;display:flex;align-items:center;gap:6px;padding:0 16px;flex:none}
.crumbs{display:flex;align-items:center;gap:4px;color:var(--text-2);min-width:0;font-size:13.5px}
.crumbs a{padding:4px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.crumbs a:hover{background:var(--hover)}
.crumbs a.cur{color:var(--text);font-weight:550}
.crumbs .i{width:14px;color:var(--text-3)}
.spacer{flex:1}
.saved{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-3);padding:0 8px}
.saved::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.view{flex:1;overflow:auto;scroll-behavior:smooth}
.view>.page-in{animation:in .35s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wrap{max-width:1080px;margin:0 auto;padding:20px 40px 80px}
.wrap.narrow{max-width:820px}
.h1{font:600 30px/1.15 var(--ui);letter-spacing:-.025em}
.h2{font:600 15px/1.3 var(--ui);letter-spacing:-.005em}
.lead{color:var(--text-2);margin-top:6px;font-size:15px}
.sec{display:flex;align-items:baseline;gap:12px;margin:36px 0 12px}
.sec a{margin-inline-start:auto;font-size:13px;color:var(--text-2);cursor:pointer}
.sec a:hover{color:var(--accent)}

/* generic parts */
.card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--raised)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:color-mix(in oklab,var(--c,var(--text-3)) 13%,var(--bg));color:var(--c,var(--text-2));white-space:nowrap}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.seg{display:inline-flex;padding:2px;background:var(--sunk);border-radius:var(--r);gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:8px;font-weight:500;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button.on{background:var(--raised);color:var(--text);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.06)}
.switch{width:36px;height:20px;border-radius:10px;background:var(--line-2);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(16px)}
:root[dir=rtl] .switch.on::after{transform:translateX(-16px)}
.check{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:transparent;transition:.15s;background:var(--bg)}
.check .i{width:12px;height:12px;stroke-width:2.4}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.field{height:34px;border:1px solid var(--line);border-radius:var(--r);padding:0 12px;background:var(--raised);width:100%;transition:border-color .15s,box-shadow .15s}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.empty{padding:36px;text-align:center;color:var(--text-3)}
.pop{position:fixed;z-index:60;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);animation:pop .16s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.985)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;width:100%;text-align:start}
.mi:hover,.mi.sel{background:var(--hover)}
.mi .i{color:var(--text-3)}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.38);backdrop-filter:blur(2px);animation:fade .15s}
:root[data-theme=dark] .scrim{background:rgba(0,0,0,.6)}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%);z-index:90;background:var(--raised);border:1px solid var(--line);box-shadow:var(--shadow-pop);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;animation:pop .2s var(--ease)}
:root[dir=rtl] .toast{transform:translateX(50%)}
.toast .i{color:var(--ok)}

/* ───────────── home ───────────── */
.hello{padding:28px 0 8px}
.hello .date{color:var(--text-3);font-size:13.5px;margin-bottom:10px}
.hello h1{font:500 46px/1.08 var(--serif);letter-spacing:-.03em}
:root[dir=rtl] .hello h1{font-family:var(--ui);font-weight:600;letter-spacing:-.01em;font-size:40px}
.hello p{margin-top:10px;color:var(--text-2);font-size:15.5px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}
.qa{display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--r-lg);text-align:start;transition:border-color .15s,transform .2s var(--ease),background .15s;background:var(--raised)}
.qa:hover{border-color:var(--line-2);transform:translateY(-2px);background:var(--bg)}
.qa b{font-weight:600;display:block}.qa small{color:var(--text-3);font-size:12.5px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
.recent{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rcard{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:border-color .15s,transform .2s var(--ease);background:var(--raised)}
.rcard:hover{border-color:var(--line-2);transform:translateY(-2px)}
.rcard .pv{height:92px;padding:14px 16px;background:var(--sunk);display:flex;flex-direction:column;gap:7px;overflow:hidden;position:relative}
.rcard .pv i{display:block;height:6px;border-radius:3px;background:var(--line-2);opacity:.85}
.rcard .pv::after{content:"";position:absolute;inset:auto 0 0;height:30px;background:linear-gradient(transparent,var(--sunk))}
.rcard .meta{padding:12px 14px;display:flex;gap:10px;align-items:center}
.rcard .meta b{font-weight:550;display:block;line-height:1.3;font-size:13.5px}
.rcard .meta small{color:var(--text-3);font-size:12px}
.list-card{padding:6px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.lrow:hover{background:var(--hover)}
.lrow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak{display:flex;gap:6px;margin-top:10px}
.streak i{flex:1;height:34px;border-radius:6px;background:var(--sunk)}
.streak i.a{background:color-mix(in oklab,var(--accent) 32%,var(--bg))}
.streak i.b{background:color-mix(in oklab,var(--accent) 62%,var(--bg))}
.streak i.c{background:var(--accent)}

/* ───────────── page / editor ───────────── */
.cover{height:168px;margin:0 40px;border-radius:var(--r-lg);position:relative;overflow:hidden}
.cover .cv-btns{position:absolute;inset-block-end:10px;inset-inline-end:10px;display:flex;gap:6px;opacity:0;transition:opacity .2s}
.cover:hover .cv-btns{opacity:1}
.cover .btn{background:color-mix(in oklab,var(--bg) 82%,transparent);backdrop-filter:blur(8px)}
.doc{max-width:var(--editor-width);margin:0 auto;padding:0 24px 120px}
.doc-head{padding-top:26px}
.doc-icon{margin-bottom:14px;cursor:pointer}
.has-cover .doc-icon{margin-top:-34px;position:relative}
.has-cover .doc-icon .tile.xl{box-shadow:0 0 0 4px var(--bg)}
.tile.xl{width:64px;height:64px;border-radius:18px}.tile.xl .i{width:30px;height:30px;stroke-width:1.6}
.title{font:600 40px/1.15 var(--editor-font);letter-spacing:-.03em;outline:none;width:100%;border:0;background:none;display:block;padding:0}
.title::placeholder{color:var(--text-3)}
.props{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:18px 0 6px;align-items:center;font-size:13.5px}
.props>span{color:var(--text-3);display:flex;align-items:center;gap:8px}
.props .i{width:15px;height:15px}
.props>div{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:30px}
.tagbtn{height:22px;padding:0 8px;border:1px dashed var(--line-2);border-radius:999px;color:var(--text-3);font-size:12px;display:inline-flex;align-items:center;gap:4px}
.tagbtn:hover{color:var(--text);border-color:var(--text-3)}
.fmt{position:sticky;top:0;z-index:5;margin:18px auto 14px;width:max-content;max-width:100%;display:flex;align-items:center;gap:1px;padding:4px;background:color-mix(in oklab,var(--raised) 92%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px -10px rgba(16,24,40,.25);overflow-x:auto}
.fmt .icon-btn{width:30px;height:30px}
.fmt .sep{width:1px;height:18px;background:var(--line);margin:0 5px;flex:none}
.fmt .plus{background:var(--accent);color:var(--accent-ink);margin-inline-end:4px}
.fmt .plus:hover{background:var(--accent);filter:brightness(1.08);color:var(--accent-ink)}
.fmt .txt{font-weight:650;font-size:12.5px;width:30px}
.body{font:400 var(--editor-size)/1.8 var(--editor-font);color:var(--text)}
.body>*+*{margin-top:12px}
.body [dir]{unicode-bidi:plaintext}
.body h2{font:600 26px/1.3 var(--editor-font);letter-spacing:-.02em;margin-top:30px;padding-bottom:0}
.body h3{font:600 20px/1.4 var(--editor-font);margin-top:24px;letter-spacing:-.01em}
.body p{outline:none}
.body code.in{font:500 .86em var(--mono);padding:2px 6px;border-radius:6px;background:var(--sunk);color:var(--accent);border:1px solid var(--line);unicode-bidi:isolate;direction:ltr}
.body a.lnk{color:var(--accent);text-decoration:underline;text-decoration-color:var(--accent-line);text-underline-offset:3px;cursor:pointer}
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:.96em;line-height:1.75}
.callout .i{color:var(--accent);margin-top:4px}
.todo{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.todo .check{margin-top:6px}.todo.done span{color:var(--text-3);text-decoration:line-through}
.bul{display:flex;gap:12px}.bul::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--text-3);margin-top:14px;flex:none}
.quote{border-inline-start:3px solid var(--line-2);padding:2px 16px;color:var(--text-2);font-family:var(--serif);font-size:1.08em}
.codeblk{direction:ltr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sunk)}
.codeblk header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--text-3)}
.codeblk pre{font:400 13.5px/1.7 var(--mono);padding:14px 16px;overflow:auto;color:var(--text)}
.k{color:#c0447e}.s{color:#1f8a5b}.n{color:#2d6fd6}.c{color:var(--text-3)}.f{color:#a56a14}
:root[data-theme=dark] .k{color:#f08bb8}:root[data-theme=dark] .s{color:#6fd3a0}:root[data-theme=dark] .n{color:#8db4f5}:root[data-theme=dark] .f{color:#e5b45a}
.math{text-align:center;font:italic 500 22px/1.6 var(--serif);padding:16px;border:1px solid var(--line);border-radius:12px;direction:ltr}
.math sup,.math sub{font-size:.6em}
.diagram{border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;justify-content:center;background:var(--bg);direction:ltr}
.diagram text{font:500 12px var(--ui);fill:var(--text)}
.dg-box{fill:var(--raised);stroke:var(--line-2)}
.dg-hi{fill:var(--accent-soft);stroke:var(--accent)}
.dg-line{stroke:var(--text-3);fill:none;stroke-width:1.4}
.toggle{border:1px solid var(--line);border-radius:12px;background:var(--raised)}
.toggle>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;font-weight:550}
.toggle>summary::-webkit-details-marker{display:none}
.toggle>summary .i{transition:transform .2s;color:var(--text-3)}
.toggle[open]>summary .i{transform:rotate(90deg)}
:root[dir=rtl] .toggle>summary .i{transform:scaleX(-1)}:root[dir=rtl] .toggle[open]>summary .i{transform:scaleX(-1) rotate(90deg)}
.toggle>div{padding:0 14px 14px 38px;color:var(--text-2)}
:root[dir=rtl] .toggle>div{padding:0 38px 14px 14px}
.toggle .tag-card{margin-inline-start:auto}
table.tbl{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:.92em}
table.tbl th{background:var(--sunk);font-weight:600;text-align:start}
table.tbl th,table.tbl td{padding:9px 14px;border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line)}
table.tbl tr:last-child td{border-bottom:0}table.tbl td:last-child,table.tbl th:last-child{border-inline-end:0}
.backlinks{margin-top:56px;padding-top:20px;border-top:1px solid var(--line)}
.backlinks .lrow{padding:8px 4px}
.dragh{position:absolute;opacity:0}
.side-panel{width:280px;flex:none;border-inline-start:1px solid var(--line);overflow:auto;padding:18px 18px 40px;background:var(--bg)}
.pagewrap{display:flex;flex:1;min-height:0}
.pagewrap .view{flex:1}
.outline a{display:block;padding:5px 10px;border-radius:6px;color:var(--text-2);cursor:pointer;border-inline-start:2px solid var(--line);border-radius:0 6px 6px 0;font-size:13px}
:root[dir=rtl] .outline a{border-radius:6px 0 0 6px}
.outline a:hover{color:var(--text)}.outline a.on{border-inline-start-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.outline a.l3{padding-inline-start:22px}
.reader .fmt,.reader .props,.reader .tagbtn,.reader .doc-icon,.reader .cover .cv-btns{display:none}
.reader .doc{max-width:680px;padding-top:30px}
.reader .body{font-family:var(--serif);font-size:19px;line-height:1.9}
.reader-bar{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%);z-index:30;display:flex;gap:4px;align-items:center;padding:5px 6px;background:var(--raised);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-pop)}
:root[dir=rtl] .reader-bar{transform:translateX(50%)}
.progress{position:absolute;top:0;inset-inline:0;height:2px;background:var(--accent);transform-origin:left;z-index:20}

/* slash menu */
.slash{width:340px;padding:6px;max-height:360px;overflow:auto}
.slash .mi{gap:12px;padding:6px 8px}
.slash .ico{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--text-2);background:var(--bg)}
.slash b{font-weight:550;display:block;line-height:1.2}.slash small{color:var(--text-3);font-size:12px}
.slash .grp-t{padding:8px 10px 4px;font-size:11.5px;color:var(--text-3);font-weight:550}

/* tables / views */
.toolbar{display:flex;align-items:center;gap:8px;margin:20px 0 16px;flex-wrap:wrap}
.vtabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
.vtabs button{display:flex;align-items:center;gap:7px;padding:9px 12px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.vtabs button:hover{color:var(--text)}
.vtabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.vtabs .i{width:16px}
.dt{width:100%;border-collapse:separate;border-spacing:0}
.dt th{font-weight:500;color:var(--text-3);font-size:12.5px;text-align:start;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt th .i{width:13px;height:13px;vertical-align:-2px;margin-inline-end:5px}
.dt td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt tr:hover td{background:var(--hover)}
.dt td.nm{font-weight:550;min-width:220px}
.dt td.nm .in{display:flex;align-items:center;gap:10px}
.dt tfoot td{color:var(--text-3);cursor:pointer}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--sunk);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:300px}
.col>header{display:flex;align-items:center;gap:8px;padding:2px 4px 4px;font-weight:600}
.kcard{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:grab;display:flex;flex-direction:column;gap:9px;transition:transform .15s,box-shadow .15s}
.kcard:hover{box-shadow:0 6px 16px -8px rgba(16,24,40,.25);transform:translateY(-1px)}
.kcard b{font-weight:550;line-height:1.35}
.kcard .m{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:650;color:#fff;background:var(--c,var(--accent))}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gal{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--raised)}
.gal .im{height:120px;position:relative}
.gal .bd{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.cal .dh{padding:8px 10px;font-size:12px;color:var(--text-3);border-bottom:1px solid var(--line);background:var(--sunk)}
.cal .d{min-height:104px;padding:6px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;display:flex;flex-direction:column;gap:3px}
.cal .d:nth-child(7n){border-inline-end:0}
.cal .d.out{color:var(--text-3);background:color-mix(in oklab,var(--sunk) 55%,transparent)}
.cal .d .n{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;margin-bottom:2px}
.cal .d.today .n{background:var(--accent);color:#fff;font-weight:650}
.ev{padding:2px 7px;border-radius:5px;font-size:11.5px;font-weight:500;background:color-mix(in oklab,var(--c) 14%,var(--bg));color:var(--c);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-inline-start:2px solid var(--c)}
.tl{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.tl-h,.tl-r{display:grid;grid-template-columns:200px repeat(12,1fr)}
.tl-h div{padding:8px;font-size:12px;color:var(--text-3);border-bottom:1px solid var(--line);background:var(--sunk);border-inline-start:1px solid var(--line)}
.tl-h div:first-child{border-inline-start:0}
.tl-r{height:44px;align-items:center;border-bottom:1px solid var(--line);position:relative}
.tl-r:last-child{border-bottom:0}
.tl-r .nm{padding:0 12px;font-weight:500;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.bar{height:24px;border-radius:7px;background:var(--c);opacity:.9;color:#fff;font-size:11.5px;padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;font-weight:550}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:16px;border:1px solid var(--line);border-radius:var(--r-lg)}
.stat small{color:var(--text-3)}.stat b{display:block;font:600 28px/1.2 var(--ui);letter-spacing:-.02em;margin-top:4px}
.stat span{font-size:12px}
.feed{display:flex;flex-direction:column;max-width:680px}
.fitem{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.fitem p{color:var(--text-2);margin-top:4px}
.form{max-width:520px;display:flex;flex-direction:column;gap:18px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:550}
.form label small{font-weight:400;color:var(--text-3)}
.map{position:relative;height:420px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--sunk)}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:550}
.pin i{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 22%,transparent);display:block}
.pin span{background:var(--raised);border:1px solid var(--line);padding:2px 8px;border-radius:6px;white-space:nowrap}
.chart-wrap{border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.chart-wrap text{font:500 11.5px var(--ui);fill:var(--text-3)}

/* tasks */
.tasks{max-width:760px}
.task{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.task .t{flex:1}.task.done .t{color:var(--text-3);text-decoration:line-through}
.task .m{display:flex;gap:8px;align-items:center;color:var(--text-3);font-size:12.5px}
.quickadd{display:flex;gap:8px;margin:18px 0}

/* templates */
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tpl{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--raised);cursor:pointer;transition:border-color .15s,transform .2s var(--ease);text-align:start}
.tpl:hover{border-color:var(--accent-line);transform:translateY(-2px)}
.tpl .pv{height:130px;background:var(--sunk);padding:16px;display:flex;flex-direction:column;gap:8px}
.tpl .pv i{display:block;height:7px;border-radius:4px;background:var(--line-2)}
.tpl .pv i.h{height:11px;width:55%;background:var(--text-3);opacity:.6}
.tpl .pv i.a{background:var(--accent);opacity:.5;width:40%}
.tpl .bd{padding:14px}.tpl .bd b{display:block;font-weight:600}.tpl .bd small{color:var(--text-3)}

/* flashcards */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.deck{padding:18px;border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;gap:14px;text-align:start;cursor:pointer;transition:border-color .15s}
.deck:hover{border-color:var(--accent-line)}
.bar-s{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}.bar-s i{display:block;height:100%;background:var(--accent);border-radius:3px}
.review{max-width:620px;margin:20px auto;display:flex;flex-direction:column;gap:20px}
.fc{min-height:300px;border:1px solid var(--line);border-radius:22px;padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;background:var(--raised);box-shadow:0 20px 40px -28px rgba(16,24,40,.3);animation:in .3s var(--ease)}
.fc .q{font:500 28px/1.35 var(--serif)}
:root[dir=rtl] .fc .q{font-family:var(--ui);font-weight:600;font-size:25px}
.fc .a{color:var(--text-2);font-size:17px;max-width:46ch;padding-top:16px;border-top:1px solid var(--line);width:100%}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grades button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px;border:1px solid var(--line);border-radius:12px;font-weight:600;transition:.15s}
.grades button small{font-weight:400;color:var(--text-3)}
.grades button:hover{border-color:var(--c);background:color-mix(in oklab,var(--c) 9%,var(--bg))}

/* graph */
.gx{position:relative;height:calc(100vh - 52px);overflow:hidden;cursor:grab;touch-action:none;user-select:none;background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/24px 24px}
.gx.grab{cursor:grabbing}
.gx svg{display:block}
.gx .edge{stroke:var(--line-2);stroke-width:1.2;transition:opacity .2s,stroke .2s}
.gx .node{cursor:pointer;transition:opacity .2s}
.gx .node .dot{fill:color-mix(in oklab,var(--c) 22%,var(--bg));stroke:var(--c);stroke-width:2;transition:fill .15s}
.gx .node .halo{fill:var(--c);opacity:0;transition:opacity .2s}
.gx .node:hover .halo,.gx .node.sel .halo{opacity:.16}
.gx .node.sel .dot,.gx .node.hot .dot{fill:var(--c)}
.gx .node text{font:500 12px var(--ui);fill:var(--text-2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.gx .node.sel text,.gx .node.hot text{fill:var(--text);font-weight:600}
.gx.focus .node:not(.hot):not(.nb),.gx .node.dim{opacity:.2}
.gx.focus .edge:not(.hot),.gx .edge.dim{opacity:.1}
.gx .edge.hot{stroke:var(--accent);stroke-width:1.8}
.gpanel,.gsel,.gzoom{position:absolute;background:color-mix(in oklab,var(--raised) 94%,transparent);backdrop-filter:blur(10px);cursor:default;box-shadow:0 8px 24px -14px rgba(16,24,40,.25)}
.gpanel{top:16px;inset-inline-start:16px;width:290px;padding:14px;display:flex;flex-direction:column;gap:12px}
.gpanel .seg{width:100%}.gpanel .seg button{flex:1;justify-content:center;padding:0 6px}
.gtags{display:flex;flex-wrap:wrap;gap:6px}
.gtags .chip{cursor:pointer;border:1px solid transparent;transition:border-color .15s}.gtags .chip:hover,.gtags .chip.on{border-color:var(--c)}
.gsel{top:16px;inset-inline-end:16px;width:300px;padding:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 32px);overflow:auto}
.gzoom{bottom:16px;inset-inline-end:16px;display:flex;flex-direction:column;padding:3px;gap:1px;border-radius:12px}
.gstat{position:absolute;bottom:16px;inset-inline-start:16px;display:flex;gap:6px}
@media (max-width:820px){.gsel{display:none}.gpanel{width:calc(100% - 32px)}}
/* drawings */
.draws{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.draw{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;background:var(--raised)}
.draw:hover{border-color:var(--line-2)}
.draw .cv{height:150px;background:var(--bg);background-image:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0);background-size:16px 16px;display:grid;place-items:center}
.draw .cv svg{width:80%;height:80%;stroke:var(--text-2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.draw .bd{padding:12px 14px;border-top:1px solid var(--line)}
.dmodal{position:fixed;inset:5vh 5vw;z-index:60;background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-pop);display:flex;flex-direction:column;overflow:hidden;animation:pop .2s var(--ease)}
.dmodal header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.dmodal .canvas{flex:1;position:relative;background-image:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0);background-size:20px 20px;cursor:crosshair}
.dmodal .tools{position:absolute;top:14px;inset-inline-start:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px;background:var(--raised);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop)}
:root[dir=rtl] .dmodal .tools{transform:translateX(50%)}

/* settings */
.set{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;margin-top:28px}
.set nav{display:flex;flex-direction:column;gap:1px;position:sticky;top:0;align-self:start}
.set nav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:var(--r-sm);color:var(--text-2);cursor:pointer;font-weight:450}
.set nav a:hover{background:var(--hover)}.set nav a.on{background:var(--hover);color:var(--text);font-weight:550}
.set-sec{max-width:640px}
.set-sec h2{font:600 20px/1.3 var(--ui);letter-spacing:-.015em}
.set-sec>p{color:var(--text-2);margin:4px 0 20px}
.grp-c{border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:20px}
.grp-c>h3{font:600 13px/1 var(--ui);padding:14px 18px 0;color:var(--text-3)}
.srow{display:flex;align-items:center;gap:20px;padding:14px 18px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow{flex-wrap:wrap}
.srow>div:first-child{flex:1;min-width:180px}
.back{transform:scaleX(-1)}:root[dir=rtl] .back{transform:none}.srow b{font-weight:550;display:block}.srow small{color:var(--text-3);display:block;margin-top:1px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 18px 18px}
.themec{border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-weight:500;transition:.15s}
.themec.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.themec .pvw{height:64px;border-radius:7px;margin-bottom:8px;display:flex;overflow:hidden;border:1px solid var(--line)}
.pvw i{display:block}.pvw .sb{width:28%}.pvw .mn{flex:1;padding:8px;display:flex;flex-direction:column;gap:5px}.pvw .mn b{height:5px;border-radius:3px;display:block}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;transition:transform .15s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw:hover{transform:scale(1.1)}.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.sw .i{width:13px;height:13px;stroke-width:2.6;opacity:0}.sw.on .i{opacity:1}
input[type=range]{-webkit-appearance:none;appearance:none;width:180px;height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--line-2) var(--p));outline-offset:6px}
:root[dir=rtl] input[type=range]{background:linear-gradient(to left,var(--accent) var(--p),var(--line-2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:1px solid var(--line-2);box-shadow:0 1px 3px rgba(0,0,0,.25)}
select.field{width:auto;min-width:160px;padding-inline-end:8px}
.ptext{border:1px solid var(--line);border-radius:12px;padding:20px 22px;font:400 var(--editor-size)/1.8 var(--editor-font);background:var(--bg)}
.sc{display:grid;grid-template-columns:1fr auto;gap:0}
.sc>*{padding:10px 18px;border-bottom:1px solid var(--line)}
.sc>*:nth-last-child(-n+2){border-bottom:0}
.sc kbd{font:500 12px var(--ui);padding:3px 7px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--bg);margin-inline-start:4px}
.conn{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.conn:last-child{border-bottom:0}
.conn .lg{width:36px;height:36px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-weight:700;color:var(--text-2)}
.tools-l{display:flex;flex-wrap:wrap;gap:6px;padding:14px 18px}
.tools-l code{font:500 12px var(--mono);padding:3px 8px;background:var(--sunk);border-radius:6px;color:var(--text-2)}
.upd{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--accent-soft);border-radius:var(--r-lg);margin-bottom:20px;border:1px solid var(--accent-line)}
.upd .i{color:var(--accent)}

/* palette */
.cmdk{top:12vh;inset-inline-start:50%;transform:translateX(-50%);width:min(620px,92vw);overflow:hidden}
:root[dir=rtl] .cmdk{transform:translateX(50%)}
.cmdk .inp{display:flex;align-items:center;gap:12px;padding:0 18px;height:54px;border-bottom:1px solid var(--line)}
.cmdk input{flex:1;border:0;background:none;outline:none;font-size:16px}
.cmdk .res{max-height:380px;overflow:auto;padding:8px}
.cmdk .grp-t{padding:8px 10px 4px;font-size:11.5px;color:var(--text-3);font-weight:550}

.bgsw.dk{color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fcell{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r)}
.fcell b{display:block;font-weight:550}.fcell small{display:block;color:var(--text-3);font-size:11.5px;line-height:1.4}
.fileic{--c:var(--text-3);--s:32px;position:relative;display:inline-grid;place-items:center;flex:none;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.28);background:color-mix(in oklab,var(--c) 14%,var(--bg));color:var(--c)}
.fileic em{position:absolute;inset-inline:0;bottom:-5px;margin-inline:auto;width:max-content;padding:0 5px;border-radius:999px;background:var(--c);color:#fff;font:600 9.5px/14px var(--ui);font-style:normal}
@media (max-width:1100px){.cols{grid-template-columns:1fr}.recent{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){
  .app,.app.side-hidden{grid-template-columns:1fr}.side{position:fixed;z-index:70;inset-block:0;inset-inline-start:0;width:280px;transform:translateX(-100%);box-shadow:var(--shadow-pop)}
  :root[dir=rtl] .side{transform:translateX(100%)}
  .app.side-open .side{transform:none}
  .wrap{padding:16px 18px 80px}.set{grid-template-columns:1fr}.set nav{flex-direction:row;overflow-x:auto;position:static}
  .recent{grid-template-columns:1fr}.cover{margin:0 18px}.side-panel{display:none}
  .hello h1{font-size:34px}.tl-h,.tl-r{grid-template-columns:120px repeat(12,minmax(40px,1fr))}.tl{overflow-x:auto}
  .grades{grid-template-columns:repeat(2,1fr)}
}
@media print{.side,.top,.fmt,.reader-bar{display:none!important}.app{display:block}body{overflow:visible}.view{overflow:visible}}

const gAdj=()=>{const a={};PAGES.forEach(p=>a[p.id]=[]);GE.forEach(([x,y])=>{if(a[x]&&a[y]){a[x].push(y);a[y].push(x)}});return a};

function initGraph(){
  const box=$('#graph');if(!box)return;
  const adjAll=gAdj();const {nodes,edges}=gData(adjAll);
  const W=box.clientWidth,H=box.clientHeight;
  if(!S.gView)S.gView={x:W/2,y:H/2,k:1};
  const V=S.gView;
  const fresh=nodes.some(id=>!GPOS[id]);
  const N=nodes.map(id=>{const pos=GPOS[id]||(GPOS[id]={x:(Math.random()-.5)*320,y:(Math.random()-.5)*320});return{id,p:pos,vx:0,vy:0,deg:adjAll[id].length,pg:byId[id]}});
  const M=Object.fromEntries(N.map(n=>[n.id,n]));
  const E=edges.map(([a,b])=>({a:M[a],b:M[b]}));

  $('#gstat').innerHTML=`<span class="chip">${num(N.length)} ${t('pages')}</span><span class="chip">${num(E.length)} ${t('links')}</span>`;
  const nodeEl={};box.querySelectorAll('.node').forEach(g=>nodeEl[g.dataset.n]=g);
  const edgeEl=[...$('#gedges').children],view=$('#gview');
  const paint=()=>{view.setAttribute('transform',`translate(${V.x} ${V.y}) scale(${V.k})`);N.forEach(n=>nodeEl[n.id].setAttribute('transform',`translate(${n.p.x.toFixed(1)} ${n.p.y.toFixed(1)})`));E.forEach((e,i)=>{const l=edgeEl[i];l.setAttribute('x1',e.a.p.x.toFixed(1));l.setAttribute('y1',e.a.p.y.toFixed(1));l.setAttribute('x2',e.b.p.x.toFixed(1));l.setAttribute('y2',e.b.p.y.toFixed(1))})};
  let alpha=fresh?1:.25,running=false;const token=++GRAF;
  const tick=()=>{
    for(let i=0;i<N.length;i++){const a=N[i];for(let j=i+1;j<N.length;j++){const b=N[j];let dx=a.p.x-b.p.x,dy=a.p.y-b.p.y;const d2=dx*dx+dy*dy+.01;if(d2>490000)continue;const d=Math.sqrt(d2),f=14000/d2*alpha;dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}}
    E.forEach(e=>{const dx=e.b.p.x-e.a.p.x,dy=e.b.p.y-e.a.p.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-170)*.05*alpha,fx=dx/d*f,fy=dy/d*f;e.a.vx+=fx;e.a.vy+=fy;e.b.vx-=fx;e.b.vy-=fy});
    N.forEach(n=>{n.vx-=n.p.x*.006*alpha;n.vy-=n.p.y*.006*alpha;if(n.fix){n.vx=n.vy=0;return}n.vx*=.78;n.vy*=.78;n.p.x+=n.vx;n.p.y+=n.vy});
  };
  const loop=()=>{if(token!==GRAF||!$('#graph')){running=false;return}if(alpha>.02){tick();alpha*=.985;paint();requestAnimationFrame(loop)}else running=false};
  const wake=()=>{if(!running){running=true;requestAnimationFrame(loop)}};
  if(fresh)for(let i=0;i<220;i++){tick();alpha*=.985}
  paint();alpha=Math.max(alpha,.2);wake();
  /* dim by search and tag */
  const apply=()=>{const q=($('#gq').value||'').trim().toLowerCase();const on=n=>(!q||pname(n.pg).toLowerCase().includes(q)||n.pg.title.toLowerCase().includes(q))&&(!S.gTag||(n.pg.tags||[]).includes(S.gTag));
    N.forEach(n=>nodeEl[n.id].classList.toggle('dim',!on(n)));E.forEach((e,i)=>edgeEl[i].classList.toggle('dim',!on(e.a)||!on(e.b)));
    box.querySelectorAll('[data-gtag]').forEach(b=>b.classList.toggle('on',b.dataset.gtag===S.gTag))};
  $('#gq').oninput=apply;apply();
  box.querySelectorAll('[data-gtag]').forEach(b=>b.onclick=()=>{S.gTag=S.gTag===b.dataset.gtag?null:b.dataset.gtag;apply()});
  /* zoom, pan, drag */
  const zoom=(f,mx=box.clientWidth/2,my=box.clientHeight/2)=>{const k=Math.min(2.5,Math.max(.4,V.k*f));V.x=mx-(mx-V.x)*k/V.k;V.y=my-(my-V.y)*k/V.k;V.k=k;paint()};
  $('#gzi').onclick=()=>zoom(1.25);$('#gzo').onclick=()=>zoom(.8);$('#gzf').onclick=()=>{V.x=box.clientWidth/2;V.y=box.clientHeight/2;V.k=1;paint()};
  box.addEventListener('wheel',e=>{if(e.target.closest('.gpanel,.gsel'))return;e.preventDefault();const r=box.getBoundingClientRect();zoom(e.deltaY<0?1.1:.9,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  let drag=null,pan=null,moved=0;
  const toWorld=(cx,cy)=>{const r=box.getBoundingClientRect();return[(cx-r.left-V.x)/V.k,(cy-r.top-V.y)/V.k]};
  box.onpointerdown=e=>{if(e.target.closest('.gpanel,.gsel,.gzoom,.gstat'))return;const g=e.target.closest('.node');moved=0;if(g){drag=M[g.dataset.n];drag.fix=true}else pan={x:e.clientX-V.x,y:e.clientY-V.y};box.setPointerCapture(e.pointerId);box.classList.add('grab')};
  box.onpointermove=e=>{if(drag){moved++;const[x,y]=toWorld(e.clientX,e.clientY);drag.p.x=x;drag.p.y=y;alpha=Math.max(alpha,.35);paint();wake()}else if(pan){moved++;V.x=e.clientX-pan.x;V.y=e.clientY-pan.y;paint()}};
  box.onpointerup=()=>{if(drag){drag.fix=false;if(moved<4)gSelect(drag.id)}drag=null;pan=null;box.classList.remove('grab')};
  /* hover highlight */
  box.onmouseover=e=>{const n=e.target.closest('.node');box.classList.toggle('focus',!!n);
    box.querySelectorAll('.node').forEach(x=>x.classList.remove('hot','nb'));edgeEl.forEach(x=>x.classList.remove('hot'));
    if(!n)return;const id=n.dataset.n;n.classList.add('hot');edgeEl.forEach(ed=>{if(ed.dataset.a===id||ed.dataset.b===id){ed.classList.add('hot');box.querySelector(`.node[data-n="${ed.dataset.a===id?ed.dataset.b:ed.dataset.a}"]`)?.classList.add('nb')}})};
  box.onmouseleave=()=>{box.classList.remove('focus');box.querySelectorAll('.node').forEach(x=>x.classList.remove('hot','nb'));edgeEl.forEach(x=>x.classList.remove('hot'))};
}

  const side=rx<th?'L':rx>1-th?'R':null;
  const pos=side?((side==='L')!==rtl?'before':'after'):(ry<.5?'before':'after');
  if(side&&!inLay){const half=cr.width/2-GUT/2;const left=side==='L';
    return{kind:'beside',tb,pos,rects:[{x:cr.left,y:r.top,w:half,h:r.height,hot:left,label:left?snip(blk):''},{x:cr.left+half+GUT,y:r.top,w:half,h:r.height,hot:!left,label:left?'':snip(blk)}]}}
  if(side&&inLay&&layCols(inLay).length<MAXC){const w=Math.min(150,cr.width*.45);return{kind:'newcol',col,pos,rects:[{x:side==='L'?cr.left-8:cr.right-w+8,y:cr.top,w,h:cr.height,hot:true,label:snip(blk)}]}}
  return{kind:'into',tb,pos,rects:[{x:r.left,y:pos==='before'?r.top-4:r.bottom+2,w:r.width,h:3,hot:true,line:true}]};
}
function moveDrag(e){
  if(!DR)return;const{ghost}=DR;ghost.style.left=(e.clientX+14)+'px';ghost.style.top=(e.clientY+12)+'px';
  const tgt=aim(e);DR.tgt=tgt;showPrev(tgt?tgt.rects:[]);
}
function endDrag(e){
  if(!DR)return;const{blk,ghost,tgt}=DR;const src=blk.closest('.lay');
  blk.classList.remove('dragging-src');ghost.remove();$('#snapprev')?.remove();document.body.classList.remove('is-dragging');DR=null;if(GRIP){GRIP.onpointermove=null;GRIP.onpointerup=null;GRIP.classList.remove('show')}
  if(!e||!tgt)return;
  laySnap();
  flip(()=>{
    if(tgt.kind==='beside')placeBeside(tgt.tb,blk,tgt.pos);
    else if(tgt.kind==='newcol')addColumn(tgt.col,blk,tgt.pos);
    else if(tgt.kind==='fill'){tgt.col.appendChild(blk);layRefresh(tgt.col.closest('.lay'));layRefresh(src)}
    else intoColumn(tgt.tb.parentElement,blk,tgt.tb,tgt.pos);
  });
  done(t(tgt.kind==='beside'||tgt.kind==='newcol'?'Snapped':'Moved'));
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&DR)endDrag(null)});


/* ═════════════════ icons, backgrounds, file icons (data comes from data.js, generated from the design-system sources) ═════════════════ */
const DSD=window.DS_DATA||{icons:[],glyphs:[],backgrounds:[],backgroundGroups:[],fileKinds:{},extensions:{}};
const svgIcon=(inner,s=22)=>`<svg class="i" viewBox="0 0 24 24" style="width:${s}px;height:${s}px" aria-hidden="true">${inner}</svg>`;
const dsIconSvg=name=>{for(const g of DSD.icons){const f=g.icons.find(x=>x[0]===name);if(f)return f[2]}return ''};
function dsIcons(){
  const grp=(label,list)=>`<h3>${label} · ${list.length}</h3><div class="icgrid">${list.map(([n,kw,svg])=>`<button class="icell" data-icn="${n}" data-kw="${esc(n+' '+kw)}" title="${n}">${svgIcon(svg)}<small>${n}</small></button>`).join('')}</div>`;
  const total=DSD.icons.reduce((n,g)=>n+g.icons.length,0)+DSD.glyphs.length;
  return `<div style="display:flex;gap:12px;align-items:center;margin-bottom:6px"><input class="field" id="icq" placeholder="${t('Search icons')}" style="max-width:320px" autocomplete="off"><span class="muted">${num(total)} ${t('icons')}</span></div>${DSD.icons.map(g=>grp(t(g.label),g.icons)).join('')}${grp(t('Page icons'),DSD.glyphs)}`;
}
function dsBackgrounds(){
  return DSD.backgroundGroups.map(g=>{const list=DSD.backgrounds.map((b,i)=>[b,i]).filter(([b])=>b.group===g.id);return `<h3>${t(g.label)} · ${list.length}</h3><div class="bggrid">${list.map(([b,i])=>`<div class="bgcell"><i class="bgsw ${b.dark?'dk':''}" data-i="${i}"><span>${LANG==='fa'?'عنوان صفحه':'Page title'}</span></i><b>${b.label}</b><code>${b.id}</code></div>`).join('')}</div>`}).join('');
}
function dsFiles(){
  const K=DSD.fileKinds;
  const tile=(k,s)=>`<span class="fileic" style="--c:${K[k].color};--s:${s}px">${svgIcon(dsIconSvg(K[k].icon),Math.round(s*.52))}</span>`;
  return `<div class="fgrid">${Object.entries(K).map(([k,v])=>`<div class="fcell">${tile(k,44)}<div><b>${v.label}</b><small>${(DSD.extensions[k]||[]).slice(0,7).join(' ')||'—'}</small></div></div>`).join('')}</div>
  <h3>${t('Sizes')}</h3><div class="demo" style="align-items:flex-end;gap:20px">${[24,32,44,64].map(s=>`<span class="fileic" style="--c:${K.pdf.color};--s:${s}px">${svgIcon(dsIconSvg(K.pdf.icon),Math.round(s*.52))}<em>pdf</em></span>`).join('')}</div>`;
}
function dsPaint(){document.querySelectorAll('.bgsw[data-i]').forEach(el=>{const b=DSD.backgrounds[+el.dataset.i];if(b)el.style.background=b.css})}
document.addEventListener('input',e=>{if(e.target.id!=='icq')return;const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.icell').forEach(c=>c.style.display=!q||c.dataset.kw.toLowerCase().includes(q)?'':'none')});
document.addEventListener('click',e=>{const c=e.target.closest('.icell');if(!c)return;try{navigator.clipboard?.writeText(c.dataset.icn)}catch{}toast(c.dataset.icn)});

/* ═════════════════ render + events ═════════════════ */
function render(){
  applyChrome();
  const app=$('#app');
  const screens={home,page,table:pagesTable,graph,tasks,templates,flash,db:dbScreen,draw:drawings,files:filesScreen,workspaces,system,trash,settings};
  const view=screens[S.route]();
  const isPage=S.route==='page';
  app.className='app'+(S.sideHidden?' side-hidden':'')+(app.classList.contains('side-open')?' side-open':'');
  app.innerHTML=sidebar()+`<main class="main">${topbar()}${isPage?view:`<div class="view" id="view">${view}</div>`}</main>`;
  if(S.route==='graph')initGraph();if(S.route==='system')dsPaint();const v=$('#view');if(v&&isPage){const body=$('#body');v.addEventListener('scroll',()=>{const p=$('#prog');if(p)p.style.transform=`scaleX(${v.scrollTop/(v.scrollHeight-v.clientHeight||1)})`})}
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-fold],[data-shut],#toggleSide,#themeBtn,#langBtn,#searchBtn,#vaultBtn,#newPage,#qaNew,#readBtn,#favBtn,#histBtn,#panelBtn,#moreBtn,#covRemove,#covChange,#plusBtn,#slashHint,#dirBtn,[data-todo],[data-copy],[data-jump],[data-gm],[data-task],#taskAdd,[data-tpl],[data-deck],#deckBack,#showAns,[data-grade],[data-vt],[data-opendraw],[data-stab],[data-theme],[data-acc],[data-seg],[data-sw],[data-lang],[data-flip],[data-toast],#doUpdate,#resetAll,[data-restore],[data-purge],#emptyTrash,#rSm,#rLg,.title');
  if(!el)return;
  if(el.dataset.fold){S.folderOpen[el.dataset.fold]=!S.folderOpen[el.dataset.fold];e.stopPropagation();render();return}
  if(el.dataset.shut){S.shut[el.dataset.shut]=!S.shut[el.dataset.shut];render();return}
  if(el.dataset.go){go(el.dataset.go,el.dataset.arg);return}
  const id=el.id;
  if(id==='toggleSide'){if(innerWidth<=820)$('#app').classList.toggle('side-open');else{S.sideHidden=!S.sideHidden;render()}return}
  if(id==='themeBtn'){S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();render();return}
  if(id==='langBtn'){toggleLang();return}
  if(id==='searchBtn'){openCmd();return}
  if(id==='vaultBtn'){openVault();return}
  if(id==='newPage'||id==='qaNew'){newPage();return}
  if(id==='readBtn'){S.reader=!S.reader;render();return}
  if(id==='favBtn'){byId[S.arg].fav=!byId[S.arg].fav;render();return}
  if(id==='histBtn'){openHistory();return}
  if(id==='panelBtn'){S.panel=!S.panel;render();return}
  if(id==='moreBtn'){openMore();return}
  if(id==='covRemove'){S.preCover=false;render();return}
  if(id==='covChange'){toast(t('Change cover'));return}
  if(id==='plusBtn'||id==='slashHint'){openSlash(el);return}
  
  if(el.dataset.todo!==undefined){const i=+el.dataset.todo;S.todo[i]=!S.todo[i];el.classList.toggle('done',S.todo[i]);el.querySelector('.check').classList.toggle('on',S.todo[i]);return}
  if(el.dataset.copy!==undefined){toast(t('Copy'));return}
  if(el.dataset.jump){document.getElementById(el.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.outline a').forEach(a=>a.classList.toggle('on',a===el));return}
  if(el.dataset.gm){S.graphMode=el.dataset.gm;render();return}
  if(el.dataset.task!==undefined){const x=S.tasks[+el.dataset.task];x.done=!x.done;render();return}
  if(id==='taskAdd'){const v=$('#taskIn').value.trim();if(v){S.tasks.unshift({t:v,fa:v,done:false,due:'Today',tag:'new'});render()}return}
  if(el.dataset.tpl){newPage();return}
  if(el.dataset.deck!==undefined){S.deck=+el.dataset.deck;S.cardIdx=0;S.cardShow=false;render();return}
  if(id==='deckBack'){S.deck=null;render();return}
  if(id==='showAns'){S.cardShow=true;render();return}
  if(el.dataset.grade!==undefined){S.cardIdx++;S.cardShow=false;render();return}
  if(el.dataset.vt){S.vtab=el.dataset.vt;render();return}
  if(el.dataset.opendraw!==undefined){drawModal();return}
  if(el.dataset.stab){S.setTab=el.dataset.stab;$('#setBody').innerHTML=setBody();document.querySelectorAll('.set nav a').forEach(a=>a.classList.toggle('on',a.dataset.stab===S.setTab));return}
  if(el.dataset.theme){S.theme=el.dataset.theme;save();render();return}
  if(el.dataset.acc){S.accent=el.dataset.acc;save();render();return}
  if(el.dataset.seg){S[el.dataset.seg]=el.dataset.v;save();render();return}
  if(el.dataset.sw){const k=el.dataset.sw;if(k==='motionOff')S.motion=!S.motion;else S[k]=!S[k];save();render();return}
  if(el.dataset.lang){LANG=el.dataset.lang;save();render();return}
  if(el.dataset.flip!==undefined){el.classList.toggle('on');el.setAttribute('aria-checked',el.classList.contains('on'));return}
  if(el.dataset.toast){toast(t(el.dataset.toast));return}
  if(id==='doUpdate'){S.notified=true;toast(t('Install and restart'));render();return}
  if(id==='resetAll'){Object.assign(S,{theme:'light',accent:'#0f8f83',side:'default',radius:10,covers:true,icons:true,motion:true,font:'sans',size:17,width:720,dir:'auto'});LANG='en';save();render();toast(t('Settings saved'));return}
  if(el.dataset.restore){S.trash=S.trash.filter(x=>x.id!==el.dataset.restore);toast(t('Restored'));render();return}
  if(el.dataset.purge){S.trash=S.trash.filter(x=>x.id!==el.dataset.purge);render();return}
  if(id==='emptyTrash'){S.trash=[];render();return}
  if(id==='rSm'){S.size=Math.max(14,S.size-1);applyChrome();return}
  if(id==='rLg'){S.size=Math.min(24,S.size+1);applyChrome();return}
});
document.addEventListener('input',e=>{const k=e.target.dataset?.rng;if(!k)return;S[k]=+e.target.value;const mn=+e.target.min,mx=+e.target.max;e.target.style.setProperty('--p',((S[k]-mn)/(mx-mn))*100+'%');e.target.nextElementSibling.textContent=num(S[k])+(k==='size'||k==='width'||k==='radius'?'px':'');applyChrome();const pt=$('.ptext');if(pt)pt.style.fontSize=S.size+'px';save()});
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd()}
  else if(mod&&e.key==='\\'){e.preventDefault();S.sideHidden=!S.sideHidden;render()}
  else if(mod&&e.key==='.'){e.preventDefault();if(S.route==='page'){S.reader=!S.reader;render()}}
  else if(e.key==='Escape'){closeAll()}
  else if(e.key==='/'&&e.target.closest?.('.body')){e.preventDefault();openSlash(e.target)}
  else if(e.key==='Enter'&&e.target.id==='taskIn'){$('#taskAdd').click()}
});
document.addEventListener('focusin',e=>{if(e.target.classList?.contains('title')&&!e.target.textContent)e.target.dataset.empty=1});
document.addEventListener('click',e=>{const a=e.target.closest('[data-ft],[data-fv],[data-file],[data-upload]');if(!a)return;if(a.dataset.ft){S.fType=a.dataset.ft;render()}else if(a.dataset.fv){S.fView=a.dataset.fv;render()}else if(a.dataset.file!==undefined)openFile(+a.dataset.file);else toast(t('Upload files'))});
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if(S.theme==='system')render()});
const q=new URLSearchParams(location.search);
if(q.get('lang')){LANG=q.get('lang')}if(q.get('theme'))S.theme=q.get('theme');
if(location.hash){const [r,a]=location.hash.slice(1).split('/');if(r){S.route=r;S.arg=a||(r==='page'?'java':null)}}
if(q.get('v'))S.vtab=q.get('v');
if(q.get('panel'))S.panel=true;if(q.get('read'))S.reader=true;if(q.get('tab'))S.setTab=q.get('tab');
if(S.route==='page'&&!S.arg)S.arg='java';
render();
</script>
