name: Desktop installers

# Windows (NSIS setup) and macOS (universal: Apple silicon and Intel) installers, attached to a draft GitHub release.
# (This repository also holds the old app: the new code's releases are tags named nx/v0.1.0.) Run it from such a tag or by hand (workflow_dispatch: the installers are then kept as run artifacts only).
on:
  workflow_dispatch:
  push:
    tags: ['nx/v*']

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
          - os: macos-latest
            args: '--target universal-apple-darwin --bundles dmg'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Tauri's beforeBuildCommand builds the shared web application.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Nevis {0}', github.ref_name) || '' }}
          releaseDraft: true
      - name: Keep the installers of a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
