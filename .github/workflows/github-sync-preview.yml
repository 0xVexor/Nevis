name: GitHub sync test installers

on:
  push:
    branches: [sync/github-personal-vaults]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-sync-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            args: --target universal-apple-darwin --bundles app
          - os: windows-latest
            platform: windows
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    env:
      NOVIQ_GITHUB_CLIENT_ID: ${{ vars.NOVIQ_GITHUB_CLIENT_ID }}
      NOVIQ_GITHUB_APP_SLUG: ${{ vars.NOVIQ_GITHUB_APP_SLUG }}
      NOVIQ_GITHUB_CREDENTIAL_SERVICE: app.noviq.github.preview
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spike/tiptap/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: spike/tiptap/src-tauri
          key: github-sync-preview-${{ matrix.platform }}
      - run: npm ci
        working-directory: spike/tiptap
      - name: Verify preview installer isolation
        if: runner.os == 'macOS'
        run: python3 .github/scripts/test-github-preview-installer.py
      - name: Build isolated test application
        run: npm run build:preview -- ${{ matrix.args }}
        working-directory: spike/tiptap
      - name: Package macOS preview without touching production apps
        if: runner.os == 'macOS'
        run: bash .github/scripts/build-github-preview-installer.sh 'spike/tiptap/src-tauri/target/universal-apple-darwin/release/bundle/macos/Nevis GitHub Preview.app' '${{ runner.temp }}/Nevis-GitHub-Preview.pkg'
      - name: Collect macOS installer and checksums
        if: runner.os == 'macOS'
        run: node .github/scripts/collect-github-preview.mjs macos '${{ runner.temp }}/Nevis-GitHub-Preview.pkg'
      - name: Collect Windows installer and checksums
        if: runner.os == 'Windows'
        run: node .github/scripts/collect-github-preview.mjs windows
      - uses: actions/upload-artifact@v4
        with:
          name: Nevis-GitHub-Preview-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/github-preview/${{ matrix.platform }}/
          retention-days: 14
          if-no-files-found: error
