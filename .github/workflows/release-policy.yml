name: Release flow

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Require the development branch
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$SOURCE_BRANCH" != dev ] || [ "$SOURCE_REPOSITORY" != "$REPOSITORY" ]; then
            echo 'Final releases must be merged from dev in this repository.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the release version
        env:
          REQUIRE_VERSION_INCREASE: '1'
        run: node .github/scripts/release-version.cjs
