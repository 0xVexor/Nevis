name: Tests

# Runs on every push and pull request: the web UI and the Rust side.
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  release-branch:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Version moves forward and the branch contains the base
        env:
          ALLOW_PRERELEASE: '1'
          REQUIRE_AHEAD_OF: origin/${{ github.base_ref }}
        run: node .github/scripts/release-version.cjs

  mcp-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/mcp-spike/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tools/mcp-spike
      - run: npm run check
        working-directory: tools/mcp-spike
      - run: npm test
        working-directory: tools/mcp-spike

  app-platforms:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spike/tiptap/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: spike/tiptap/src-tauri
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: spike/tiptap
      - run: npm ci
        working-directory: db/tests/tools
      - run: npm run test:db
        working-directory: spike/tiptap
      - run: npx tsc -b
        working-directory: spike/tiptap
      - run: npm run check:ui
        working-directory: spike/tiptap
      - run: npm run check:docs
        working-directory: spike/tiptap
      - run: node ../../db/check-i18n.mjs
        working-directory: spike/tiptap
      - run: npm run test:layout
        working-directory: spike/tiptap
      - run: npm run test:direction
        working-directory: spike/tiptap
      - run: npm ci --ignore-scripts
        working-directory: db/tests/tools
      - run: npm run test:documents
        working-directory: spike/tiptap
      - run: npm run test:updates
        working-directory: spike/tiptap
      - run: npm run build
        working-directory: spike/tiptap
      - run: cargo test
        working-directory: spike/tiptap/src-tauri

  # Keep the existing protected-branch check name while requiring every platform.
  app:
    name: app
    needs: app-platforms
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all application platforms to pass
        env:
          PLATFORM_RESULT: ${{ needs.app-platforms.result }}
        run: test "$PLATFORM_RESULT" = success

  # The sync server (server/). On pull requests it only does its work when the pull request touches server/; on
  # pushes to main and dev it always runs.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change touch the server?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ] || git diff --name-only "origin/$BASE...HEAD" | grep -q '^server/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go.sum matches go.mod
        if: steps.scope.outputs.run == 'true'
        run: go mod tidy -diff
        working-directory: server
      - if: steps.scope.outputs.run == 'true'
        run: go vet ./...
        working-directory: server
      - name: gofmt
        if: steps.scope.outputs.run == 'true'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        working-directory: server
      - if: steps.scope.outputs.run == 'true'
        run: go test -race ./...
        working-directory: server
      - name: Smoke test against the real binary
        if: steps.scope.outputs.run == 'true'
        run: |
          go build -o "$RUNNER_TEMP/nevis-server" ./cmd/nevis-server
          export SESSION_SECRET="$(openssl rand -hex 24)" REGISTRATION=open POW_BITS=12 PORT=3111 DATA_DIR="$RUNNER_TEMP/nevis-data"
          "$RUNNER_TEMP/nevis-server" &
          server=$!
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:3111/v1/health >/dev/null && break; sleep 0.2; done
          status=0
          go run ./cmd/smoke http://127.0.0.1:3111 || status=$?
          kill $server
          exit $status
        working-directory: server

  # The desktop sync client against the real Go server: the end-to-end tests of the Rust client (they are ignored in a
  # plain `cargo test` because they need a server), pointed at a server started from this very commit.
  sync-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: spike/tiptap/src-tauri
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build and start the server
        run: |
          go build -o "$RUNNER_TEMP/nevis-server" ./cmd/nevis-server
          export SESSION_SECRET="$(openssl rand -hex 24)" REGISTRATION=open POW_BITS=12 PORT=3111 DATA_DIR="$RUNNER_TEMP/nevis-data" REGISTER_PER_HOUR=1000
          nohup "$RUNNER_TEMP/nevis-server" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:3111/v1/health >/dev/null && exit 0; sleep 0.2; done
          cat "$RUNNER_TEMP/server.log"; exit 1
        working-directory: server
      - name: Rust client against the server
        env:
          NEVIS_TEST_SERVER: http://127.0.0.1:3111
        run: cargo test e2e -- --ignored --test-threads=1
        working-directory: spike/tiptap/src-tauri
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
