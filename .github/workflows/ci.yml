name: Tests

# Runs on every push and pull request: the web UI and the Rust side.
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  app-platforms:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spike/tiptap/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: spike/tiptap/src-tauri
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: spike/tiptap
      - run: npm ci
        working-directory: db/tests/tools
      - run: npm run test:db
        working-directory: spike/tiptap
      - run: npx tsc -b
        working-directory: spike/tiptap
      - run: npm run test:layout
        working-directory: spike/tiptap
      - run: npm run test:direction
        working-directory: spike/tiptap
      - run: npm run test:updates
        working-directory: spike/tiptap
      - run: npm run build
        working-directory: spike/tiptap
      - run: cargo test
        working-directory: spike/tiptap/src-tauri

  # Keep the existing protected-branch check name while requiring every platform.
  app:
    name: app
    needs: app-platforms
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all application platforms to pass
        env:
          PLATFORM_RESULT: ${{ needs.app-platforms.result }}
        run: test "$PLATFORM_RESULT" = success
