name: CI

on:
  push:
    branches: [nevis-next]
  pull_request:
    branches: [nevis-next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Architecture rules and types
        run: pnpm check
      - name: Package tests
        run: pnpm test
      - name: Server tests (with the race detector)
        run: pnpm test:go

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium firefox webkit
      - name: Browser tests (the real server, three engines)
        run: pnpm --filter web exec playwright test --project=chromium --project=firefox --project=webkit
        env:
          CI: '1'
