name: Server image

# This repository also holds the old app on main and dev: the new code lives on the branch `nevis-next` and its releases are tags named nx/v1.2.3.
# Pushes publish to the GitHub Container Registry. Release tags also publish a versioned image.
on:
  push:
    branches: [nevis-next]
    tags: ['nx/v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nevis-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/nevis-next' }}
            type=sha,format=short
            type=match,pattern=nx/v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # optional: tell the server (Coolify) to pull the new image; set the secret COOLIFY_DEPLOY_WEBHOOK to enable
      - name: Ask the server to deploy
        if: github.ref == 'refs/heads/nevis-next' && env.HOOK != ''
        env:
          HOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "$HOOK"
