name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-source:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
      target: ${{ steps.channel.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check release source and channel
        id: channel
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == *-* ]]; then
            git merge-base --is-ancestor HEAD origin/dev
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
            echo 'target=dev' >> "$GITHUB_OUTPUT"
            ALLOW_PRERELEASE=1 node .github/scripts/release-version.cjs
          else
            if [[ "$GITHUB_REF_TYPE" != tag && "$GITHUB_REF" != refs/heads/main ]]; then
              echo 'Stable installer builds must use main or a final release tag on main.' >&2
              exit 1
            fi
            git merge-base --is-ancestor HEAD origin/main
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
            echo 'target=main' >> "$GITHUB_OUTPUT"
            node .github/scripts/release-version.cjs
          fi
      - name: Prepare the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ steps.channel.outputs.target }}
          PREVIEW: ${{ steps.channel.outputs.prerelease }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --target "$TARGET" --draft --prerelease="$PREVIEW" --title "Nevis $TAG" --notes-file "docs/releases/$TAG.md"
          fi

  build:
    needs: release-source
    strategy:
      fail-fast: false
      # Each build merges its platform into the same latest.json release asset.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spike/tiptap/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: spike/tiptap/src-tauri
      - run: npm ci
        working-directory: spike/tiptap
      - name: Configure signed updates
        env:
          NEVIS_UPDATER_PUBLIC_KEY: ${{ vars.NEVIS_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node .github/scripts/updater-config.cjs
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: spike/tiptap
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Nevis ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ needs.release-source.outputs.prerelease == 'true' }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Verify macOS installer scripts
        if: matrix.os == 'macos-latest'
        run: python3 .github/scripts/test-macos-installer.py
      - name: Build macOS replacement installer
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          bash .github/scripts/build-macos-installer.sh \
            spike/tiptap/src-tauri/target/universal-apple-darwin/release/bundle/macos/Nevis.app \
            spike/tiptap/src-tauri/target/universal-apple-darwin/release/bundle/Nevis-macOS.pkg
      - name: Attach macOS installer
        if: matrix.os == 'macos-latest' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: gh release upload "$TAG" spike/tiptap/src-tauri/target/universal-apple-darwin/release/bundle/Nevis-macOS.pkg --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Nevis-${{ matrix.os }}
          path: |
            spike/tiptap/src-tauri/target/**/release/bundle/**/*.exe
            spike/tiptap/src-tauri/target/**/release/bundle/**/*.msi
            spike/tiptap/src-tauri/target/**/release/bundle/**/*.pkg
            spike/tiptap/src-tauri/target/**/release/bundle/**/*.dmg
            spike/tiptap/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            spike/tiptap/src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [release-source, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP/updater"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/updater/release.json"
          node .github/scripts/verify-updater.cjs "$RUNNER_TEMP/updater/latest.json" "$RUNNER_TEMP/updater/release.json"
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ needs.release-source.outputs.target }}
          PREVIEW: ${{ needs.release-source.outputs.prerelease }}
        run: |
          if [ "$PREVIEW" = true ]; then
            gh release edit "$TAG" --target "$TARGET" --draft=false --prerelease --latest=false --title "Nevis $TAG" --notes-file "docs/releases/$TAG.md"
          else
            gh release edit "$TAG" --target "$TARGET" --draft=false --prerelease=false --latest --title "Nevis $TAG" --notes-file "docs/releases/$TAG.md"
          fi
