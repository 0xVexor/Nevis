<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nevis.</title>
    <meta name="author" content="Vexor" />
    <script>
      // First paint: take the saved theme before any stylesheet loads, so there is no light flash in dark mode.
      ;(function () {
        try {
          var s = JSON.parse(localStorage.getItem("not.settings") || "null") || {}
          var dark = s.theme === "dark" || (s.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
          var r = document.documentElement, st = r.style
          if (s.theme === "light" || s.theme === "dark") r.dataset.theme = s.theme
          st.setProperty("--sp-bg", dark ? "#191c20" : "#fcfcfb")
          st.setProperty("--sp-text", dark ? "#e9eee9" : "#222923")
          st.setProperty("--sp-accent", s.accent ? (dark ? "color-mix(in oklab, " + s.accent + " 78%, #fff)" : s.accent) : dark ? "#65b5a7" : "#087f74")
          st.background = dark ? "#191c20" : "#fcfcfb"
          st.colorScheme = dark ? "dark" : "light"
        } catch (e) {}
      })()
    </script>
    <style>
      #splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--sp-bg,#fcfcfb);color:var(--sp-accent,#087f74);transition:opacity .5s ease}
      #splash.out{opacity:0;pointer-events:none}
      #splash svg{width:84px;height:84px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;animation:splash-in .5s cubic-bezier(.2,.8,.2,1) both}
      #splash path{stroke-dasharray:1;stroke-dashoffset:1;animation:splash-draw .9s .2s cubic-bezier(.4,0,.2,1) forwards}
      #splash path+path{animation-delay:.6s}
      #splash b{font:600 26px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.01em;color:var(--sp-text,#222923);animation:splash-name .6s 1.1s ease both}
      #splash b i{font-style:normal;font-size:3em;line-height:0;color:var(--sp-accent,#087f74)}
      @keyframes splash-name{from{opacity:0;transform:translateY(6px)}}
      @keyframes splash-draw{to{stroke-dashoffset:0}}
      @keyframes splash-in{from{opacity:0;transform:scale(.86)}}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path pathLength="1" d="M12.67 19a2 2 0 0 0 1.416-.588l6.154-6.172a6 6 0 0 0-8.49-8.49L5.586 9.914A2 2 0 0 0 5 11.328V18a1 1 0 0 0 1 1z"/><path pathLength="1" d="M16 8 2 22M17.5 15H9"/></svg>
      <b>Nevis<i>.</i></b>
    </div>
    <script>
      // Start animation: the logo draws itself, then the screen fades once the app has rendered. Short on purpose.
      ;(function () {
        var el = document.getElementById("splash"), t0 = Date.now(), gone = false
        var quiet = false
        try { quiet = matchMedia("(prefers-reduced-motion: reduce)").matches || !!(JSON.parse(localStorage.getItem("not.settings") || "null") || {}).reduceMotion } catch (e) {}
        function remove() {
          if (el.parentNode) el.parentNode.removeChild(el)
          // the first-paint colours were only a stand-in: from here the stylesheet and the theme setting decide
          document.documentElement.style.removeProperty("background")
          document.documentElement.style.removeProperty("color-scheme")
        }
        window.__splashDone = function () {
          if (gone) return
          gone = true
          if (quiet) return remove()
          setTimeout(function () { el.className = "out"; setTimeout(remove, 550) }, Math.max(0, 2300 - (Date.now() - t0)))
        }
        if (quiet) el.style.display = "none"
        setTimeout(window.__splashDone, 8000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
