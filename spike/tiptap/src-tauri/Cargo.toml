[package]
name = "noviq"
version = "0.1.0"
description = "Noviq: offline notes with full Persian/RTL support"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
