[package]
name = "nevis"
version = "1.0.0"
description = "Nevis: offline notes with full Persian/RTL support"
edition = "2021"

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
semver = "1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "system-proxy", "socks", "http2"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
same-file = "1"
httpdate = "1"
md-5 = "0.10"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
flate2 = "1"
tar = "0.4"
trash = "5" # moves a vault folder to the Recycle Bin / Trash instead of deleting it

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
